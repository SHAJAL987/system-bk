    logger:
      trace: traceLogger
      error: errorLogger
      performance: performanceLogger
      serviceIP: localhost
      logPath: "D:/WorkStation/system-bk/auth_logging/"
spring:
  application:
    name: system-service
  datasource:
    url: jdbc:postgresql://192.168.0.101:5432/AUTH
    username: postgres
    password: postgres
